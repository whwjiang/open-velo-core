[package]
name = "velocore-telemetry-wasm"
version = "0.2.0"
edition = "2021"
description = "Zero-copy ANT+ (USB) and BLE (GATT) cycling telemetry decoder and FE-C/FTMS smart trainer control core compiled to WebAssembly."
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
