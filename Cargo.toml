[package]
name = "open-velo-core"
version = "0.4.0"
edition = "2021"
description = "Self-contained Rust/WASM cycling telemetry, physiological modeling, workout compliance, and .FIT activity engine"

[lib]
path = "rust/lib.rs"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
